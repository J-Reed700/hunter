<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<title>hunter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f0913a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230b0b0d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <a class="brand" href="#/dashboard">
      <span class="brand-mark"></span>
      <span class="brand-name">hunter</span>
      <span class="brand-ver">{{VERSION}}</span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="side-status"></div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div id="crumbs"></div>
      <div class="topbar-spacer"></div>
      <button class="search-trigger" id="search-btn">
        <span class="search-ico">⌕</span><span class="only-desktop">Search anything</span>
        <kbd class="only-desktop">⌘K</kbd>
      </button>
      <div id="top-actions"></div>
      <div id="top-status"></div>
    </header>
    <main id="view"></main>
  </div>

  <nav id="tabbar" class="only-mobile"></nav>

  <div id="selbar" hidden></div>
  <div id="drawer-host"></div>
  <div id="modal-host"></div>
  <div id="toasts"></div>
  <div id="palette" hidden></div>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
