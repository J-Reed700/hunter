[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter"
version = "5.0.0"
description = "Self-hosted music acquisition orchestrator and library console for Spotify, MusicBrainz, Soulseek (slskd), Prowlarr, beets, and Navidrome."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
hunter = "hunter.cli:main"

[tool.setuptools.packages.find]
include = ["hunter*"]

[tool.setuptools.package-data]
hunter = ["web/static/*", "web/static/views/*"]
